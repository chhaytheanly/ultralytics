# Ultralytics YOLO 🚀
# YOLO11-GED-S
#
# Ghost + Adaptive EMA + Selective Dynamic Sampling
#
# Target:
# Industrial fastener detection and counting

nc: 1

scale: s

scales:
  s: [0.50, 0.50, 1024]


backbone:

  # =========================
  # P1 / stride 2
  # =========================

  - [-1, 1, Conv, [64, 3, 2]]


  # =========================
  # P2 / stride 4
  # =========================

  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C2f, [128, True]]


  # =========================
  # P3 / stride 8
  # =========================

  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C2f, [256, True]]


  # =========================
  # P4 / stride 16
  # =========================

  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, EMAc2f, [512, True]]


  # =========================
  # P5 / stride 32
  # =========================

  - [-1, 1, Conv, [768, 3, 2]]
  - [-1, 2, EMAc2f, [768, True]]


  # =========================
  # Context
  # =========================

  - [-1, 1, SPPF, [768, 5]]


head:

  # =========================
  # P5 -> P4
  # =========================

  - [-1, 1, DySample, [2]]

  - [[-1, 6], 1, Concat, [1]]

  - [-1, 2, EMAc2f, [512]]


  # =========================
  # P4 -> P3
  # =========================

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  - [[-1, 4], 1, Concat, [1]]

  - [-1, 2, C2f, [256]]


  # =========================
  # P3 -> P4
  # =========================

  - [-1, 1, Conv, [256, 3, 2]]

  - [[-1, 12], 1, Concat, [1]]

  - [-1, 2, EMAc2f, [512]]


  # =========================
  # P4 -> P5
  # =========================

  - [-1, 1, Conv, [512, 3, 2]]

  - [[-1, 9], 1, Concat, [1]]

  - [-1, 2, EMAc2f, [768]]


  # =========================
  # Detection
  # =========================

  - [[15, 18, 21], 1, Detect, [nc]]
