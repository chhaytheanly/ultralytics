# Ultralytics YOLO 🚀
# YOLO11-GED-S
# Ghost + EMA + DySample
# Optimized for industrial fastener detection

nc: 80

scale: s

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.75, 0.75, 768]

backbone:

  # P1
  - [-1, 1, Conv, [64, 3, 2]]

  # P2
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C2f, [128, True]]

  # P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C2f, [256, True]]

  # P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 3, EMAc2f, [512, True]]

  # P5
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, EMAc2f, [1024, True]]

  # SPPF
  - [-1, 1, SPPF, [1024, 5]]

head:

  # ---------- P5 → P4 ----------
  - [-1, 1, DySample, [2]]

  - [[-1, 6], 1, Concat, [1]]

  - [-1, 3, EMAc2f, [512]]

  # ---------- P4 → P3 ----------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]

  - [[-1, 4], 1, Concat, [1]]

  - [-1, 3, C2f, [256]]

  # ---------- Bottom-up ----------

  - [-1, 1, Conv, [256, 3, 2]]

  - [[-1, 12], 1, Concat, [1]]

  - [-1, 3, EMAc2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]

  - [[-1, 9], 1, Concat, [1]]

  - [-1, 3, EMAc2f, [1024]]

  - [[15, 18, 21], 1, Detect, [nc]]
